name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  build-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with GCC
        run: |
          make clean
          make CC=gcc -j$(nproc)
          echo "Build successful"
      - name: Run unit tests
        run: make test

  build-clang-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Clang + ASan
        run: |
          make clean
          make CC=clang asan -j$(nproc)
          echo "ASan build successful"

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build fuzz target
        run: |
          make clean
          FUZZ_CC=clang FUZZ_CXX=clang++ make fuzz
          echo "Fuzz target built successfully"
      - name: Run fuzzer with corpus
        run: |
          echo "=== Running roguelike_fuzzer ==="
          mkdir -p fuzz/corpus/roguelike_fuzzer
          timeout 60 ./fuzz/roguelike_fuzzer fuzz/corpus/roguelike_fuzzer/ -max_total_time=30 -max_len=256 -timeout=5 || true
          echo "Fuzzer run complete"
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz/corpus/roguelike_fuzzer/**/*
