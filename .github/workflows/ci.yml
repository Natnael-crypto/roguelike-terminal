name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build main game
      run: |
        make clean
        make -j$(nproc)

    - name: Build with AddressSanitizer
      run: |
        make asan -j$(nproc)

    - name: Run unit tests
      run: |
        make test

  fuzz:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build fuzz target
      run: |
        make fuzz

    - name: Run fuzzer (30 seconds)
      run: |
        mkdir -p fuzz/corpus/roguelike_fuzzer
        timeout 60 ./fuzz/roguelike_fuzzer fuzz/corpus/roguelike_fuzzer/ -max_total_time=30 -max_len=256 -timeout=5 || true

    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-crashes
        path: fuzz/corpus/roguelike_fuzzer/**/*
